  // ===== UPLOAD DOCX TO SUPABASE =====
async function uploadDocxToSupabase(docxBlob, annualReturnId, templateName) {
  const currentreturnyear = new Date().getFullYear();
  const cleanName = templateName.replace(".docx", "");

  const filePath = `annual_returns/wholesale/${annualReturnId}/${currentreturnyear}/${cleanName}.docx`;

  const { error } = await supabase.storage
    .from('annual_return_documents_bucket')
    .upload(filePath, docxBlob, {
      contentType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      upsert: true
    });

  if (error) throw error;

  return filePath;
}

// ===== SAVE RECORD =====
async function saveDocumentRecord(annualReturnId, filePath, templateName) {
  const { error } = await supabase
    .from('annual_return_documents')
    .insert({
      annual_return_id: annualReturnId,
      document_type: templateName,
      file_path: filePath,
      version: 1
    });

  if (error) throw error;
}
